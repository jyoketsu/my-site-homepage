worker_processes auto;

events {
  worker_connections 1024;
}

http {
	server {
		listen 80;
		server_name vue.xujie.cc;

		location / {
			proxy_pass http://vue3-template:80; # 确保服务名与 docker-compose.yml 一致
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}

	server {
		listen 80;
		server_name nuxt.xujie.cc;

		location / {
			proxy_pass http://nuxt-template:80; # 通过服务名访问容器
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}
}
